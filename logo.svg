<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 身体渐变黄 -->
    <radialGradient id="bodyGrad" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="60%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </radialGradient>
    
    <!-- 肚子浅色渐变 -->
    <radialGradient id="bellyGrad" cx="50%" cy="60%" r="50%" fx="50%" fy="60%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FFE082" />
    </radialGradient>
    
    <!-- 手臂渐变 -->
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>

  <!-- 纯白背景 -->
  <rect width="200" height="200" fill="#ffffff" />

  <!-- 奶蛙的身体（梨形） -->
  <path d="M 100 20 C 140 20, 150 60, 160 110 C 170 170, 145 190, 100 190 C 55 190, 30 170, 40 110 C 50 60, 60 20, 100 20 Z" fill="url(#bodyGrad)" />

  <!-- 奶蛙的肚子 -->
  <ellipse cx="100" cy="145" rx="55" ry="45" fill="url(#bellyGrad)" />

  <!-- 交叉的双手 -->
  <!-- 右手（从右侧伸出） -->
  <path d="M 150 105 Q 120 130, 80 115" stroke="url(#armGrad)" stroke-width="28" stroke-linecap="round" fill="none" />
  <!-- 左手（从左侧伸出，压在上面） -->
  <path d="M 50 110 Q 80 130, 120 118" stroke="url(#armGrad)" stroke-width="28" stroke-linecap="round" fill="none" />

  <!-- 手部指头细节（灰褐色） -->
  <path d="M 110 110 Q 130 115, 135 125" stroke="#8D6E63" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 115 116 Q 135 121, 140 130" stroke="#8D6E63" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 120 123 Q 135 128, 135 136" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- 左眼 -->
  <circle cx="70" cy="65" r="16" fill="#81C784" />
  <circle cx="70" cy="65" r="10" fill="#212121" />
  <circle cx="68" cy="62" r="3" fill="#ffffff" />

  <!-- 右眼 -->
  <circle cx="130" cy="65" r="16" fill="#81C784" />
  <circle cx="130" cy="65" r="10" fill="#212121" />
  <circle cx="128" cy="62" r="3" fill="#ffffff" />

  <!-- 嘴巴（微笑） -->
  <path d="M 90 90 Q 100 95 110 90" stroke="#424242" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
